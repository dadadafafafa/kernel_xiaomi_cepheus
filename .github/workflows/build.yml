name: Build cepheus kernel SukiSU123

on:
  workflow_dispatch:
  push:
    branches:
      - 17.0

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bc bison build-essential cpio flex git kmod libssl-dev \
            libelf-dev libncurses5-dev libncurses-dev lld llvm \
            python3 python-is-python3 wget curl zip unzip bzip2 \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            pkg-config libyaml-dev

          curl -L "https://downloads.python.org/pypy/pypy2.7-v7.3.17-linux64.tar.bz2" -o /tmp/pypy2.tar.bz2
          sudo mkdir -p /opt/pypy2
          sudo tar -xjf /tmp/pypy2.tar.bz2 -C /opt/pypy2 --strip-components=1
          sudo ln -sf /opt/pypy2/bin/pypy /usr/local/bin/python2
          python2 --version

      - name: Prepare author toolchain path
        run: |
          set -e

          mkdir -p /home/raystef66/kernel/prebuilts
          cd /home/raystef66/kernel/prebuilts

          if [ ! -d clang-r416183b1 ]; then
            mkdir clang-r416183b1
            cd clang-r416183b1
            curl -L "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/141af4b7b36d1bb2a70b4ef2a65faf3b46253eb9/clang-r416183b1.tar.gz" | tar -xz
            cd ..
          fi

          mkdir -p gcc/linux-x86/aarch64/aarch64-linux-android-4.9/bin
          mkdir -p gcc/linux-x86/arm/arm-linux-androideabi-4.9/bin

          ln -sf /usr/bin/aarch64-linux-gnu-gcc gcc/linux-x86/aarch64/aarch64-linux-android-4.9/bin/aarch64-linux-android-gcc
          ln -sf /usr/bin/aarch64-linux-gnu-ld gcc/linux-x86/aarch64/aarch64-linux-android-4.9/bin/aarch64-linux-android-ld
          ln -sf /usr/bin/aarch64-linux-gnu-ar gcc/linux-x86/aarch64/aarch64-linux-android-4.9/bin/aarch64-linux-android-ar
          ln -sf /usr/bin/aarch64-linux-gnu-objcopy gcc/linux-x86/aarch64/aarch64-linux-android-4.9/bin/aarch64-linux-android-objcopy
          ln -sf /usr/bin/aarch64-linux-gnu-objdump gcc/linux-x86/aarch64/aarch64-linux-android-4.9/bin/aarch64-linux-android-objdump
          ln -sf /usr/bin/aarch64-linux-gnu-strip gcc/linux-x86/aarch64/aarch64-linux-android-4.9/bin/aarch64-linux-android-strip

          ln -sf /usr/bin/arm-linux-gnueabi-gcc gcc/linux-x86/arm/arm-linux-androideabi-4.9/bin/arm-linux-androideabi-gcc
          ln -sf /usr/bin/arm-linux-gnueabi-ld gcc/linux-x86/arm/arm-linux-androideabi-4.9/bin/arm-linux-androideabi-ld
          ln -sf /usr/bin/arm-linux-gnueabi-ar gcc/linux-x86/arm/arm-linux-androideabi-4.9/bin/arm-linux-androideabi-ar
          ln -sf /usr/bin/arm-linux-gnueabi-objcopy gcc/linux-x86/arm/arm-linux-androideabi-4.9/bin/arm-linux-androideabi-objcopy
          ln -sf /usr/bin/arm-linux-gnueabi-objdump gcc/linux-x86/arm/arm-linux-androideabi-4.9/bin/arm-linux-androideabi-objdump
          ln -sf /usr/bin/arm-linux-gnueabi-strip gcc/linux-x86/arm/arm-linux-androideabi-4.9/bin/arm-linux-androideabi-strip

      - name: Prepare AnyKernel3 and SukiSU Ultra
        run: |
          set -e

          rm -rf AnyKernel3 KernelSU KernelSU-Next drivers/kernelsu

          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3

          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash

          test -d KernelSU
          test -e drivers/kernelsu

      - name: Patch build compatibility
        run: |
          set -e

          sed -i 's/HOSTLDLIBS_dtc/HOSTLOADLIBES_dtc/g' scripts/dtc/Makefile
          sed -i 's/^kernel.string=.*/kernel.string=InfiniR SukiSU Ultra/' anykernel.sh
          sed -i 's/^supported.versions=.*/supported.versions=10-16/' anykernel.sh

      - name: Build kernel
        run: |
          set -e

          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_USER=raystef66
          export KBUILD_BUILD_HOST=github
          export PATH="/home/raystef66/kernel/prebuilts/clang-r416183b1/bin:$PATH"

          make O=out ARCH=arm64 cepheus_defconfig

          scripts/config --file out/.config -e KSU || true
          scripts/config --file out/.config -e KSU_MANUAL_HOOK || true

          make O=out ARCH=arm64 olddefconfig

          grep -E '^CONFIG_KSU=y' out/.config

          make -j$(nproc) O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-

      - name: Package kernel zip
        run: |
          set -e

          test -f out/arch/arm64/boot/Image.gz-dtb

          rm -rf out_zip
          mkdir -p out_zip

          cp -r AnyKernel3/* out_zip/
          cp out/arch/arm64/boot/Image.gz-dtb out_zip/Image.gz-dtb

          if [ -f anykernel.sh ]; then
            cp anykernel.sh out_zip/anykernel.sh
          fi

          cd out_zip
          zip -r9 ../InfiniR_cepheus_v2.01_A16_SukiSU_Ultra_test.zip .
          cd ..

          ls -lh InfiniR_cepheus_v2.01_A16_SukiSU_Ultra_test.zip
          sha256sum InfiniR_cepheus_v2.01_A16_SukiSU_Ultra_test.zip

      - name: Upload kernel zip
        uses: actions/upload-artifact@v4
        with:
          name: InfiniR-cepheus-SukiSU-Ultra-kernel
          path: InfiniR_cepheus_v2.01_A16_SukiSU_Ultra_test.zip
