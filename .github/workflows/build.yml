#将 KernelSU-Next 从旧版本 (12349) 更新到 v3.1.0-legacy-susfs-v2 (33007).
#支持 SUSFS v2.1.0，使用 sidex15 的 legacy-susfs-v2 分支，适用于非 GKI 4.x 内核.
#KernelSU-Nextapp使用3.1.0
name: Build cepheus kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential bc bison flex libssl-dev libelf-dev \
            git zip unzip ccache python3 curl pkg-config libyaml-dev \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            pypy

          sudo ln -sf /usr/bin/pypy /usr/local/bin/python2
          python2 --version

      - name: Prepare author toolchain path
        run: |
          sudo mkdir -p /home/raystef66/kernel/prebuilts
          sudo chown -R $USER:$USER /home/raystef66/kernel

          cd /home/raystef66/kernel/prebuilts

          curl -L \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/141af4b7b36d1bb2a70b4ef2a65faf3b46253eb9/clang-r416183b1.tar.gz" \
            -o clang-r416183b1.tar.gz

          mkdir -p clang-r416183b1
          tar -xf clang-r416183b1.tar.gz -C clang-r416183b1

          mkdir -p aarch64/bin arm/bin

          for f in /usr/bin/aarch64-linux-gnu-*; do
            ln -sf "$f" "aarch64/bin/$(basename "$f")"
          done

          for f in /usr/bin/arm-linux-gnueabi-*; do
            ln -sf "$f" "arm/bin/$(basename "$f")"
          done

      - name: Prepare missing folders
        run: |
          set -e

          rm -rf AnyKernel3 KernelSU-Next

          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3

          mkdir KernelSU-Next
          cd KernelSU-Next
          git init
          git remote add origin https://github.com/KernelSU-Next/KernelSU-Next.git
          git fetch --depth=1 origin e8e6836425478ee44d026576f8127936d383ded5
          git checkout FETCH_HEAD
          cd ..

      - name: Patch old host build variable
        run: |
          set -e
          sed -i 's/HOSTLDLIBS_dtc/HOSTLOADLIBES_dtc/g' scripts/dtc/Makefile
          grep -n 'HOSTLOADLIBES_dtc' scripts/dtc/Makefile

      - name: Build kernel
        run: |
          set -e

          export TC="/home/raystef66/kernel/prebuilts"
          export PATH="${TC}/clang-r416183b1/bin:${TC}/aarch64/bin:${TC}/arm/bin:$PATH"

          export LLVM=1
          export CC=clang
          export CROSS_COMPILE=aarch64-linux-gnu-
          export ARCH=arm64
          export USE_CCACHE=1

          make O=out ARCH=arm64 cepheus_defconfig

          make ARCH=arm64 \
            O=out \
            CC=clang \
            AR=llvm-ar \
            LD=ld.lld \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            -j$(nproc)

          ls -lh out/arch/arm64/boot/
          test -s out/arch/arm64/boot/Image.gz-dtb

      - name: Package kernel zip
        run: |
          set -e

          FINAL_KERNEL_ZIP=InfiniR_cepheus_v2.01_A16_KSUN_susfs-v2.1.0_test.zip

          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/Image.gz-dtb
          cp anykernel.sh AnyKernel3/anykernel.sh

          test -s AnyKernel3/Image.gz-dtb

          cd AnyKernel3
          zip -r9 "../$FINAL_KERNEL_ZIP" * -x README README.md LICENSE .git/\*

          cd ..
          unzip -l "$FINAL_KERNEL_ZIP" | grep Image.gz-dtb
          sha1sum "$FINAL_KERNEL_ZIP"

      - name: Upload kernel zip
        uses: actions/upload-artifact@v4
        with:
          name: InfiniR-cepheus-kernel
          path: InfiniR_cepheus_v2.01_A16_KSUN_susfs-v2.1.0_test.zip
