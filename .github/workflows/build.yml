name: Build cepheus SukiSU Ultra Fixed v4.1.2 legacy 4.14

# 这个 workflow 固定使用一个已知能编译通过的 SukiSU Ultra 版本。
# 如果想保持当前这套 4.14 老内核兼容补丁继续可用，请保持 SUKISU_REF 为 v4.1.2。
# 如果后续想测试新版 SukiSU Ultra，优先只改 SUKISU_REF。
# 升级后如果上游改了内核接口或文件结构，可能需要重新修下面的兼容补丁。
env:
  SUKISU_REF: v4.1.2

on:
  workflow_dispatch:
  push:
    branches:
      - 17.0
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Install dependencies
        run: |
          set -e
          sudo apt update
          sudo apt install -y \
            bc bison build-essential cpio flex git kmod libssl-dev \
            libelf-dev libncurses5-dev libncurses-dev lld llvm \
            python3 python-is-python3 wget curl zip unzip bzip2 \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            pkg-config libyaml-dev

          curl -L "https://downloads.python.org/pypy/pypy2.7-v7.3.17-linux64.tar.bz2" -o /tmp/pypy2.tar.bz2
          sudo mkdir -p /opt/pypy2
          sudo tar -xjf /tmp/pypy2.tar.bz2 -C /opt/pypy2 --strip-components=1
          sudo ln -sf /opt/pypy2/bin/pypy /usr/local/bin/python2
          python2 --version

      - name: Prepare Android clang
        run: |
          set -e
          mkdir -p prebuilts/clang-r416183b1
          if [ ! -x prebuilts/clang-r416183b1/bin/clang ]; then
            curl -L "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/141af4b7b36d1bb2a70b4ef2a65faf3b46253eb9/clang-r416183b1.tar.gz" \
              | tar -xz -C prebuilts/clang-r416183b1
          fi
          prebuilts/clang-r416183b1/bin/clang --version | head -2

      - name: Prepare AnyKernel3 and SukiSU Ultra
        run: |
          set -e
          rm -rf AnyKernel3 KernelSU KernelSU-Next drivers/kernelsu
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3

          # setup.sh 会把 SukiSU Ultra 安装到 KernelSU / drivers/kernelsu。
          # setup.sh 默认跟随上游最新版，所以这里安装后立刻 checkout 到 SUKISU_REF。
          # 当前 SUKISU_REF 固定为 v4.1.2，避免后续自动升级导致编译补丁失效。
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash
          git -C KernelSU fetch --tags --force
          git -C KernelSU checkout -f "${SUKISU_REF}"
          test -d KernelSU
          test -e drivers/kernelsu
          git -C KernelSU describe --tags --always

      - name: Apply legacy 4.14 compatibility patches
        run: |
          set -e

          # Generic build fixes used by this 4.14 tree.
          sed -i 's/HOSTLDLIBS_dtc/HOSTLOADLIBES_dtc/g' scripts/dtc/Makefile
          sed -i 's/cmd_mkdtimg = python3/cmd_mkdtimg = python2/g' scripts/Makefile.lib
          sed -i 's/^kernel.string=.*/kernel.string=InfiniR SukiSU Ultra legacy 4.14/' anykernel.sh
          sed -i 's/^supported.versions=.*/supported.versions=10-16/' anykernel.sh

          # SukiSU source compatibility for this non-GKI 4.14 kernel.
          sed -i '/MODULE_IMPORT_NS(VFS_internal_I_am_really_a_filesystem_and_am_NOT_a_driver);/d' drivers/kernelsu/ksu.c
          sed -i 's/#include <linux\/pgtable.h>/#include <asm\/pgtable.h>/g' drivers/kernelsu/sucompat.c drivers/kernelsu/util.c
          sed -i 's/mmap_read_trylock(mm)/down_read_trylock(\&mm->mmap_sem)/g' drivers/kernelsu/util.c
          sed -i 's/mmap_read_unlock(mm)/up_read(\&mm->mmap_sem)/g' drivers/kernelsu/util.c
          sed -i 's/TWA_RESUME/true/g' drivers/kernelsu/*.c
          sed -i 's/ksys_close(/sys_close(/g' drivers/kernelsu/*.c
          sed -i 's/ksys_unshare(/sys_unshare(/g' drivers/kernelsu/*.c
          grep -q '#include <linux/sched/task.h>' drivers/kernelsu/allowlist.c || \
            sed -i '/#include <linux\/task_work.h>/a #include <linux/sched/task.h>' drivers/kernelsu/allowlist.c

          python3 <<'PY'
          from pathlib import Path
          p = Path("drivers/kernelsu/util.h")
          s = p.read_text()
          if "#define strncpy_from_user_nofault" not in s:
              s = s.replace(
                  "#include <linux/types.h>\n",
                  "#include <linux/types.h>\n#include <linux/uaccess.h>\n\n"
                  "#ifndef strncpy_from_user_nofault\n"
                  "#define strncpy_from_user_nofault strncpy_from_unsafe_user\n"
                  "#endif\n\n"
                  "#ifndef copy_from_user_nofault\n"
                  "#define copy_from_user_nofault copy_from_user\n"
                  "#endif\n\n"
                  "#ifndef copy_to_user_nofault\n"
                  "#define copy_to_user_nofault copy_to_user\n"
                  "#endif\n\n",
                  1,
              )
              p.write_text(s)

          p = Path("drivers/kernelsu/seccomp_cache.h")
          s = p.read_text()
          if "static inline void ksu_seccomp_allow_cache" not in s:
              s = s.replace(
                  "#endif\n\n#endif",
                  "#else\n"
                  "static inline void ksu_seccomp_clear_cache(struct seccomp_filter *filter, int nr) {}\n"
                  "static inline void ksu_seccomp_allow_cache(struct seccomp_filter *filter, int nr) {}\n"
                  "#endif\n\n#endif",
                  1,
              )
              p.write_text(s)

          p = Path("drivers/kernelsu/syscall_hook_manager.c")
          s = p.read_text()
          if "#define __NR_clone3 -1" not in s:
              s = s.replace(
                  '#include "syscall_hook_manager.h"\n',
                  '#include "syscall_hook_manager.h"\n\n'
                  "#ifndef __NR_clone3\n"
                  "#define __NR_clone3 -1\n"
                  "#endif\n",
                  1,
              )
              p.write_text(s)

          p = Path("drivers/kernelsu/manual_su.c")
          s = p.read_text()
          if "#include <linux/random.h>" not in s:
              s = s.replace("#include <linux/binfmts.h>\n", "#include <linux/binfmts.h>\n#include <linux/random.h>\n", 1)
              p.write_text(s)
          PY

          cp drivers/kernelsu/pkg_observer.c drivers/kernelsu/pkg_observer.c.sukisu-full.bak
          cat > drivers/kernelsu/pkg_observer.c <<'EOF'
          // SPDX-License-Identifier: GPL-2.0
          #include <linux/errno.h>
          #include <linux/fs.h>
          #include <linux/fsnotify_backend.h>
          #include <linux/namei.h>
          #include <linux/printk.h>
          #include <linux/slab.h>
          #include <linux/string.h>

          #include "klog.h" // IWYU pragma: keep
          #include "throne_tracker.h"

          #define MASK_SYSTEM (FS_CREATE | FS_MOVE | FS_EVENT_ON_CHILD)

          struct watch_dir {
              const char *path;
              u32 mask;
              struct path kpath;
              struct inode *inode;
              struct fsnotify_mark *mark;
          };

          static struct fsnotify_group *g;

          static int ksu_handle_event(struct fsnotify_group *group, struct inode *inode,
                                      struct fsnotify_mark *inode_mark,
                                      struct fsnotify_mark *vfsmount_mark, u32 mask,
                                      const void *data, int data_type,
                                      const unsigned char *file_name, u32 cookie,
                                      struct fsnotify_iter_info *iter_info)
          {
              if (!file_name)
                  return 0;
              if (mask & FS_ISDIR)
                  return 0;
              if (!strcmp(file_name, "packages.list")) {
                  pr_info("packages.list detected: %d\n", mask);
                  track_throne(false);
              }
              return 0;
          }

          static const struct fsnotify_ops ksu_ops = {
              .handle_event = ksu_handle_event,
          };

          static int add_mark_on_inode(struct inode *inode, u32 mask,
                                       struct fsnotify_mark **out)
          {
              struct fsnotify_mark *m;

              m = kzalloc(sizeof(*m), GFP_KERNEL);
              if (!m)
                  return -ENOMEM;

              fsnotify_init_mark(m, g);
              m->mask = mask;

              if (fsnotify_add_mark(m, inode, NULL, 0)) {
                  fsnotify_put_mark(m);
                  return -EINVAL;
              }
              *out = m;
              return 0;
          }

          static int watch_one_dir(struct watch_dir *wd)
          {
              int ret = kern_path(wd->path, LOOKUP_FOLLOW, &wd->kpath);
              if (ret) {
                  pr_info("path not ready: %s (%d)\n", wd->path, ret);
                  return ret;
              }
              wd->inode = d_inode(wd->kpath.dentry);
              ihold(wd->inode);

              ret = add_mark_on_inode(wd->inode, wd->mask, &wd->mark);
              if (ret) {
                  pr_err("Add mark failed for %s (%d)\n", wd->path, ret);
                  path_put(&wd->kpath);
                  iput(wd->inode);
                  wd->inode = NULL;
                  return ret;
              }
              pr_info("watching %s\n", wd->path);
              return 0;
          }

          static void unwatch_one_dir(struct watch_dir *wd)
          {
              if (wd->mark) {
                  fsnotify_destroy_mark(wd->mark, g);
                  fsnotify_put_mark(wd->mark);
                  wd->mark = NULL;
              }
              if (wd->inode) {
                  iput(wd->inode);
                  wd->inode = NULL;
              }
              if (wd->kpath.dentry) {
                  path_put(&wd->kpath);
                  memset(&wd->kpath, 0, sizeof(wd->kpath));
              }
          }

          static struct watch_dir g_watch = {
              .path = "/data/system",
              .mask = MASK_SYSTEM,
          };

          int ksu_observer_init(void)
          {
              int ret;

              g = fsnotify_alloc_group(&ksu_ops);
              if (IS_ERR(g))
                  return PTR_ERR(g);

              ret = watch_one_dir(&g_watch);
              pr_info("observer init done\n");
              return ret;
          }

          void ksu_observer_exit(void)
          {
              unwatch_one_dir(&g_watch);
              if (g)
                  fsnotify_put_group(g);
              pr_info("observer exit done\n");
          }
          EOF

          # file_wrapper, dynamic sepolicy injection, and mount namespace code in current
          # SukiSU Ultra target newer kernel internals. Use legacy stubs for this 4.14 build.
          cp drivers/kernelsu/file_wrapper.c drivers/kernelsu/file_wrapper.c.sukisu-full.bak
          cat > drivers/kernelsu/file_wrapper.c <<'EOF'
          // SPDX-License-Identifier: GPL-2.0
          #include <linux/errno.h>
          #include <linux/fdtable.h>
          #include <linux/file.h>
          #include <linux/fs.h>
          #include <linux/printk.h>

          #include "file_wrapper.h"
          #include "klog.h" // IWYU pragma: keep

          int ksu_install_file_wrapper(int fd)
          {
              int out_fd;
              struct file *orig_file = fget(fd);

              if (!orig_file)
                  return -EBADF;

              out_fd = get_unused_fd_flags(O_CLOEXEC);
              if (out_fd < 0) {
                  fput(orig_file);
                  return out_fd;
              }

              fd_install(out_fd, orig_file);
              return out_fd;
          }

          void ksu_file_wrapper_init(void)
          {
              pr_info("file_wrapper: using legacy fd passthrough mode\n");
          }
          EOF

          cp drivers/kernelsu/su_mount_ns.c drivers/kernelsu/su_mount_ns.c.sukisu-full.bak
          cat > drivers/kernelsu/su_mount_ns.c <<'EOF'
          // SPDX-License-Identifier: GPL-2.0
          #include <linux/printk.h>
          #include <linux/types.h>

          #include "su_mount_ns.h"
          #include "klog.h" // IWYU pragma: keep

          void setup_mount_ns(int32_t ns_mode)
          {
              if (ns_mode != KSU_NS_INHERITED)
                  pr_info("mount_ns: legacy 4.14 build keeps inherited namespace\n");
          }
          EOF

          cp drivers/kernelsu/selinux/sepolicy.c drivers/kernelsu/selinux/sepolicy.c.sukisu-full.bak
          cp drivers/kernelsu/selinux/rules.c drivers/kernelsu/selinux/rules.c.sukisu-full.bak
          cat > drivers/kernelsu/selinux/sepolicy.c <<'EOF'
          // SPDX-License-Identifier: GPL-2.0
          #include "sepolicy.h"
          EOF

          cat > drivers/kernelsu/selinux/rules.c <<'EOF'
          // SPDX-License-Identifier: GPL-2.0
          #include <linux/errno.h>
          #include <linux/printk.h>
          #include <linux/uaccess.h>

          #include "selinux.h"
          #include "../klog.h" // IWYU pragma: keep

          void apply_kernelsu_rules(void)
          {
              pr_info("sepolicy: dynamic rule injection disabled on legacy 4.14 build\n");
          }

          int handle_sepolicy(unsigned long arg3, void __user *arg4)
          {
              return -EOPNOTSUPP;
          }
          EOF

          cat > drivers/kernelsu/legacy_compat.c <<'EOF'
          // SPDX-License-Identifier: GPL-2.0
          #include <linux/binfmts.h>
          #include <linux/fs.h>
          #include <linux/sched.h>
          #include <linux/types.h>
          #include <linux/uaccess.h>

          #include "ksud.h"

          int ksu_handle_execveat_ksud(int *fd, struct filename **filename_ptr,
                                       void *argv, void *envp, int *flags);

          int ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *argv,
                                  void *envp, int *flags)
          {
              return ksu_handle_execveat_ksud(fd, filename_ptr, argv, envp, flags);
          }

          int ksu_handle_vfs_read(struct file **file_ptr, char __user **buf_ptr,
                                  size_t *count_ptr, loff_t **pos)
          {
              return 0;
          }

          void seccomp_filter_release(struct task_struct *tsk)
          {
          }
          EOF

          python3 <<'PY'
          from pathlib import Path
          p = Path("drivers/kernelsu/Kbuild")
          s = p.read_text()
          if "legacy_compat.o" not in s:
              s = s.replace("kernelsu-objs += tiny_sulog.o\n", "kernelsu-objs += tiny_sulog.o\nkernelsu-objs += legacy_compat.o\n", 1)
              p.write_text(s)
          PY

      - name: Configure kernel
        run: |
          set -e
          export PATH="$GITHUB_WORKSPACE/prebuilts/clang-r416183b1/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_USER=github
          export KBUILD_BUILD_HOST=actions
          export LLVM=1
          export CC=clang
          export CROSS_COMPILE=aarch64-linux-gnu-

          make O=out ARCH=arm64 cepheus_defconfig
          scripts/config --file out/.config -e KSU || true
          scripts/config --file out/.config -e KSU_MANUAL_SU || true
          scripts/config --file out/.config -d KPM || true
          make O=out ARCH=arm64 olddefconfig
          grep -E '^CONFIG_KSU=y|^CONFIG_KSU_MANUAL_SU=y' out/.config

      - name: Build kernel
        run: |
          set -e
          export PATH="/usr/local/bin:$GITHUB_WORKSPACE/prebuilts/clang-r416183b1/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_USER=github
          export KBUILD_BUILD_HOST=actions
          export LLVM=1
          export CC=clang
          export CROSS_COMPILE=aarch64-linux-gnu-

          make -j"$(nproc)" O=out \
            ARCH=arm64 \
            CC=clang \
            AR=llvm-ar \
            LD=ld.lld \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip

          test -f out/arch/arm64/boot/Image.gz-dtb

      - name: Package AnyKernel3 zip
        run: |
          set -e
          ZIP_NAME="InfiniR_cepheus_A16_SukiSU_Ultra_${SUKISU_REF}_legacy4.14_${GITHUB_RUN_NUMBER}.zip"
          rm -rf out_zip
          mkdir -p out_zip
          cp -r AnyKernel3/* out_zip/
          cp out/arch/arm64/boot/Image.gz-dtb out_zip/Image.gz-dtb
          cp anykernel.sh out_zip/anykernel.sh
          cd out_zip
          zip -r9 "../${ZIP_NAME}" . >/dev/null
          cd ..
          ls -lh "${ZIP_NAME}" out/arch/arm64/boot/Image.gz-dtb
          sha256sum "${ZIP_NAME}" out/arch/arm64/boot/Image.gz-dtb
          echo "ZIP_NAME=${ZIP_NAME}" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cepheus-SukiSU-Ultra-legacy-4.14
          path: |
            ${{ env.ZIP_NAME }}
            out/arch/arm64/boot/Image.gz-dtb
            build_sukisu.log
          if-no-files-found: warn
